<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻页机械臂控制</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            text-align: center;
        }
        .header h1 { font-size: 24px; font-weight: 600; }
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #eee;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
            margin-right: 10px;
            transition: background 0.3s;
        }
        .status-indicator.connected { background: #28a745; }
        .status-text { font-size: 14px; color: #666; }
        .content { padding: 20px; }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 15px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary { background: #e9ecef; color: #495057; }
        .btn-secondary:hover { background: #dee2e6; }
        .btn-connect { grid-column: 1 / -1; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .btn-connect:hover { box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4); }
        .btn-connect.connected { background: #6c757d; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }
        .position-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .position-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .position-item:last-child { border-bottom: none; }
        .position-label { color: #666; font-size: 14px; }
        .position-value { color: #333; font-weight: 600; font-size: 14px; }
        .position-value.set { color: #667eea; }
        .log-section { margin-top: 20px; }
        .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .log-title { font-size: 16px; font-weight: 600; color: #333; }
        .log-container {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
        }
        .log-line { color: #d4d4d4; margin-bottom: 5px; line-height: 1.4; }
        .log-line.info { color: #4fc3f7; }
        .log-line.success { color: #81c784; }
        .language-toggle { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .lang-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .lang-btn.active { background: #667eea; color: white; }
        .lang-btn:hover { background: #667eea; color: white; }
        .bluetooth-note {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #856404;
        }
        @media (max-width: 480px) { .btn-group { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1 id="appTitle">翻页机械臂控制</h1></div>
        
        <div class="content">
            <div class="bluetooth-note" id="bluetoothNote">
                <strong>注意：</strong>此页面需要浏览器支持 Web Bluetooth API。请使用 Chrome、Edge 或 Opera 浏览器，并确保 HTTPS 或 localhost 环境访问。
            </div>
            
            <div class="language-toggle">
                <button class="lang-btn active" id="langZh" onclick="setLanguage('zh')">中文</button>
                <button class="lang-btn" id="langEn" onclick="setLanguage('en')">English</button>
            </div>
            
            <div class="status-bar">
                <div class="status-indicator" id="statusIndicator"></div>
                <span class="status-text" id="statusText">未连接</span>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-connect" id="connectBtn" onclick="toggleConnect()">连接蓝牙</button>
                <button class="btn btn-primary" id="initBtn" onclick="sendCommand('init')" disabled>设置起始点</button>
                <button class="btn btn-primary" id="finalBtn" onclick="sendCommand('fina')" disabled>设置终点</button>
                <button class="btn btn-secondary" id="pageBtn" onclick="sendCommand('move')" disabled>翻页</button>
                <button class="btn btn-secondary" id="statusBtn" onclick="sendCommand('statu')" disabled>查看状态</button>
            </div>
            
            <div class="position-info">
                <div class="position-item">
                    <span class="position-label" id="startLabel">起始点:</span>
                    <span class="position-value" id="startValue">未设置</span>
                </div>
                <div class="position-item">
                    <span class="position-label" id="endLabel">终点:</span>
                    <span class="position-value" id="endValue">未设置</span>
                </div>
            </div>
            
            <div class="log-section">
                <div class="log-header">
                    <span class="log-title" id="logTitle">日志</span>
                    <button class="btn btn-secondary" style="padding:5px 15px;font-size:12px" onclick="clearLog()">清除</button>
                </div>
                <div class="log-container" id="logContainer"><div class="log-line">System ready. Click "Connect Bluetooth" to start.</div></div>
            </div>
        </div>
    </div>

    <script>
        // Pybricks Bluetooth UUIDs
        const PYBRICKS_SERVICE_UUID = 'c5f50001-8280-46da-89f4-6d8051e4aeef';
        const PYBRICKS_COMMAND_CHAR_UUID = 'c5f50002-8280-46da-89f4-6d8051e4aeef';
        const HUB_NAME = 'Gary';
        
        let lang = 'zh';
        let device = null;
        let server = null;
        let characteristic = null;
        let connected = false;
        let pendingCmd = null;
        let initFlag = null;
        let finalFlag = null;
        let dataBuffer = '';
        
        const t = {
            zh: {
                title: '翻页机械臂控制',
                connect: '连接蓝牙',
                disconnect: '断开连接',
                init: '设置起始点',
                final: '设置终点',
                page: '翻页',
                status: '查看状态',
                startLabel: '起始点:',
                endLabel: '终点:',
                notSet: '未设置',
                logTitle: '日志',
                statusDisconnected: '未连接',
                statusConnected: '已连接',
                bluetoothNote: '<strong>注意：</strong>此页面需要浏览器支持 Web Bluetooth API。请使用 Chrome、Edge 或 Opera 浏览器，并确保 HTTPS 或 localhost 环境访问。'
            },
            en: {
                title: 'Page Turner Arm Control',
                connect: 'Connect Bluetooth',
                disconnect: 'Disconnect',
                init: 'Set Start',
                final: 'Set End',
                page: 'Turn Page',
                status: 'Check Status',
                startLabel: 'Start:',
                endLabel: 'End:',
                notSet: 'Not Set',
                logTitle: 'Log',
                statusDisconnected: 'Disconnected',
                statusConnected: 'Connected',
                bluetoothNote: '<strong>Note:</strong> This page requires Web Bluetooth API support. Use Chrome, Edge, or Opera browser, and ensure HTTPS or localhost access.'
            }
        };
        
        function setLanguage(l) {
            lang = l;
            const tr = t[l];
            document.getElementById('appTitle').textContent = tr.title;
            document.getElementById('startLabel').textContent = tr.startLabel;
            document.getElementById('endLabel').textContent = tr.endLabel;
            document.getElementById('logTitle').textContent = tr.logTitle;
            document.getElementById('bluetoothNote').innerHTML = tr.bluetoothNote;
            document.getElementById('langZh').classList.toggle('active', l === 'zh');
            document.getElementById('langEn').classList.toggle('active', l === 'en');
            updateStatusDisplay();
        }
        
        function updateStatusDisplay() {
            const tr = t[lang];
            const indicator = document.getElementById('statusIndicator');
            const statusText = document.getElementById('statusText');
            const connectBtn = document.getElementById('connectBtn');
            
            if (connected) {
                indicator.classList.add('connected');
                statusText.textContent = tr.statusConnected;
                connectBtn.textContent = tr.disconnect;
                connectBtn.classList.add('connected');
            } else {
                indicator.classList.remove('connected');
                statusText.textContent = tr.statusDisconnected;
                connectBtn.textContent = tr.connect;
                connectBtn.classList.remove('connected');
            }
            
            ['initBtn', 'finalBtn', 'pageBtn', 'statusBtn'].forEach(id => {
                document.getElementById(id).disabled = !connected;
            });
            
            const sv = document.getElementById('startValue');
            const ev = document.getElementById('endValue');
            if (initFlag) {
                sv.textContent = JSON.stringify(initFlag);
                sv.classList.add('set');
            } else {
                sv.textContent = tr.notSet;
                sv.classList.remove('set');
            }
            if (finalFlag) {
                ev.textContent = JSON.stringify(finalFlag);
                ev.classList.add('set');
            } else {
                ev.textContent = tr.notSet;
                ev.classList.remove('set');
            }
        }
        
        function addLog(msg, level = 'info') {
            const lc = document.getElementById('logContainer');
            const line = document.createElement('div');
            line.className = `log-line ${level}`;
            line.textContent = msg;
            lc.appendChild(line);
            lc.scrollTop = lc.scrollHeight;
        }
        
        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
        }
        
        async function toggleConnect() {
            if (connected) {
                await disconnect();
            } else {
                await connect();
            }
        }
        
        async function connect() {
            try {
                dataBuffer = '';
                addLog('Requesting Bluetooth device...', 'info');
                
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Gary' }],
                    optionalServices: [PYBRICKS_SERVICE_UUID]
                });
                
                addLog(`Device: ${device.name}`, 'success');
                
                device.addEventListener('gattserverdisconnected', onDisconnected);
                
                server = await device.gatt.connect();
                const service = await server.getPrimaryService(PYBRICKS_SERVICE_UUID);
                characteristic = await service.getCharacteristic(PYBRICKS_COMMAND_CHAR_UUID);
                
                await characteristic.startNotifications();
                characteristic.addEventListener('characteristicvaluechanged', onCharacteristicChanged);
                
                connected = true;
                updateStatusDisplay();
                addLog('Connected successfully!', 'success');
                
            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
                connected = false;
                updateStatusDisplay();
            }
        }
        
        async function disconnect() {
            try {
                if (device && device.gatt.connected) {
                    device.gatt.disconnect();
                }
                connected = false;
                updateStatusDisplay();
                addLog('Disconnected', 'info');
            } catch (error) {
                addLog(`Disconnect error: ${error.message}`, 'error');
            }
        }
        
        function onDisconnected(event) {
            connected = false;
            dataBuffer = '';
            updateStatusDisplay();
            addLog('Device disconnected', 'warning');
        }
        
        function onCharacteristicChanged(event) {
            const value = event.target.value;
            if (!value || value.byteLength === 0) return;
            
            const data = new Uint8Array(value.buffer);
            if (data[0] !== 0x01) return;
            
            const payload = data.slice(1);
            const text = new TextDecoder('utf-8', { fatal: false }).decode(payload);
            
            // 累积数据
            dataBuffer += text;
            
            // 按换行符分割处理
            const lines = dataBuffer.split('\n');
            dataBuffer = lines.pop(); // 保留最后未完成的部分
            
            for (const line of lines) {
                const trimmed = line.trim();
                if (trimmed) {
                    addLog(trimmed, 'info');
                    parseResponse(trimmed);
                }
            }
        }
        
        function parseResponse(text) {
            text = text.trim();
            if (!text) return;
            
            try {
                let angles;
                if (text.startsWith('[')) {
                    angles = JSON.parse(text);
                } else if (text.split(' ').length === 3) {
                    angles = text.split(' ').map(Number);
                } else {
                    return;
                }
                
                if (Array.isArray(angles) && angles.length === 3 && angles.every(n => typeof n === 'number')) {
                    if (pendingCmd === 'init') {
                        initFlag = angles;
                        pendingCmd = null;
                        updateStatusDisplay();
                        addLog(`Start point saved: ${angles}`, 'success');
                    } else if (pendingCmd === 'final') {
                        finalFlag = angles;
                        pendingCmd = null;
                        updateStatusDisplay();
                        addLog(`End point saved: ${angles}`, 'success');
                    }
                }
            } catch (e) {
                // Ignore parse errors
            }
        }
        
        async function sendCommand(cmd) {
            if (!connected || !characteristic) {
                addLog('Not connected', 'error');
                return;
            }
            
            try {
                if (cmd === 'init') pendingCmd = 'init';
                else if (cmd === 'fina') pendingCmd = 'final';
                
                // Convert to 4-byte command
                const encoder = new TextEncoder();
                let cmdBytes = encoder.encode(cmd);
                
                // Pad or truncate to 4 bytes
                if (cmdBytes.length < 4) {
                    const padded = new Uint8Array(4);
                    padded.set(cmdBytes);
                    cmdBytes = padded;
                } else if (cmdBytes.length > 4) {
                    cmdBytes = cmdBytes.slice(0, 4);
                }
                
                // Add header byte 0x06
                const packet = new Uint8Array(5);
                packet[0] = 0x06;
                packet.set(cmdBytes, 1);
                
                await characteristic.writeValue(packet);
                addLog(`Sent: ${cmd}`, 'success');
                
            } catch (error) {
                addLog(`Send error: ${error.message}`, 'error');
            }
        }
        
        // Check Web Bluetooth support
        if (!navigator.bluetooth) {
            document.getElementById('bluetoothNote').innerHTML = 
                '<strong>错误：</strong>您的浏览器不支持 Web Bluetooth API。请使用 Chrome、Edge 或 Opera 浏览器。';
        }
    </script>
</body>
</html>
